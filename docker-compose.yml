# The site (Django + gunicorn) and its PostgreSQL database, each in its own container.
# Copy .env.example to .env and fill it in, then: docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizzaria}
      POSTGRES_USER: ${POSTGRES_USER:-pizzaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, so it only passes once the first-run initialisation has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-pizzaria}
      POSTGRES_USER: ${POSTGRES_USER:-pizzaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - storage:/app/storage

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:    # the database
  storage:   # product photos and profile photo uploads (MEDIA_ROOT)
